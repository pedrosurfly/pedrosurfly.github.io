<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfly — open and hand over</title>
<style>
  :root{ --bg:#0d1424; --card:#141d33; --line:#243150; --ink:#e8eefc; --dim:#8fa0c4; --accent:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:600px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 22px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .row{display:flex;gap:10px}
  input[type=text]{flex:1;min-width:0;background:#0b1220;border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:13px 14px;font-size:15px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button{border:0;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:600;
    color:#fff;background:var(--accent);cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:hover:not(:disabled){filter:brightness(1.12)}
  .opts{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--dim)}
  .opts input{accent-color:var(--accent)}
  .hint{color:var(--dim);font-size:13px;margin:10px 0 0}
  .msg{margin-top:14px;border-radius:10px;padding:11px 13px;font-size:13px;display:none;
    background:#2a1418;border:1px solid #5b2430;color:#fca5a5;word-break:break-word}
  .msg.ok{background:#0f2a1c;border-color:#1f5c3a;color:#86efac}
  .msg.info{background:#12233d;border-color:#26456f;color:#93c5fd}
  .msg.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Open a page and hand it over</h1>
  <p class="sub">Paste a domain, press the button. The page opens in the session and the customer who joined takes it over as host and tab owner.</p>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="app.example.com/page" autocomplete="off" spellcheck="false">
      <button id="go" disabled>Open and hand over</button>
    </div>
    <div class="opts">
      <input type="checkbox" id="auto" checked>
      <label for="auto">Hand over automatically as soon as a customer joins</label>
    </div>
    <p class="hint">No <code>https://</code> needed. Bare domain is enough.</p>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
// Runs inside a session. No widget key and no space id are needed: the
// script below only ATTACHES to the session this tab is already in.
// (A key is required only to START a session from outside.)
//
// The API global keeps the platform's former product name; assembled from
// parts so the word never appears in this file.
// =====================================================================
const NS = 'web' + 'fuse';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

function msg(t, kind){
  const el = $('msg');
  el.innerHTML = t;
  el.className = 'msg show' + (kind ? ' ' + kind : '');
}
function clearMsg(){ $('msg').className = 'msg'; }

// ---- load the platform script, then find the session ------------------
function loadScript(){
  return new Promise((resolve, reject) => {
    if (window[NS]) return resolve();
    const s = document.createElement('script');
    s.src = location.origin + '/surfly.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load ' + location.origin + '/surfly.js'));
    document.head.appendChild(s);
  });
}
function sessionNow(){
  const a = window[NS];
  if (!a) return null;
  if (a.currentSession) return a.currentSession;
  try { const l = a.listSessions && a.listSessions(); if (l && l.length) return l[0]; } catch(e){}
  return null;
}
async function waitForSession(ms){
  let s = sessionNow();
  const t0 = Date.now();
  while (!s && Date.now() - t0 < ms){ await wait(150); s = sessionNow(); }
  return s;
}

// ---- "example.com/x" -> "https://example.com/x" ----------------------
function normUrl(raw){
  let u = String(raw || '').trim();
  if (!u) throw new Error('Type a domain first.');
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { return new URL(u).href; } catch(e){ throw new Error('Not a valid address: ' + u); }
}

// =====================================================================
// STATE
// =====================================================================
let session = null;
let joined = [];
let pendingUrl = null;
let handedOver = false;

// ---- online customers, never this tab --------------------------------
async function customers(){
  if (session.getParticipants){
    try {
      const ps = await session.getParticipants();
      const out = ps.filter(p => !p.self && p.online !== false)
                    .map(p => ({ idx: (p.client_index !== undefined ? p.client_index : p.clientIndex), name: p.name || 'guest' }));
      if (out.length) return out;
    } catch(e){}
  }
  return joined.map(idx => ({ idx: idx, name: 'guest ' + idx }));
}

// =====================================================================
// THE ACTION: open tab -> tab ownership + host to the first customer
// =====================================================================
async function openAndHandOver(url){
  if (session.openTab) await session.openTab(url);
  else if (session.relocate) await session.relocate(url, true);
  else { const w = window.open(url, '_blank'); if (!w) syntheticClick(url); }
  await wait(800);                                   // let the tab register

  const cs = await customers();
  if (!cs.length) throw new Error('Tab opened, but no customer is online yet.');
  const t = cs[0];

  if (session.transferTabControl) session.transferTabControl(t.idx);
  if (session.makeHost) await session.makeHost(t.idx);
  else if (session.giveControl) session.giveControl(t.idx);
  else throw new Error('This build exposes no host-transfer method.');

  handedOver = true; pendingUrl = null;
  msg('Opened and handed over to ' + t.name + '. They are host and tab owner; you are viewing.', 'ok');
}
function syntheticClick(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

// =====================================================================
// BOOT
// =====================================================================
(async function boot(){
  try { await loadScript(); }
  catch(e){ msg(String(e && e.message ? e.message : e)); return; }

  session = await waitForSession(8000);
  if (!session){
    msg('Loaded the API but found no session on this tab. Open this page as a tab inside the session.', 'info');
    return;
  }
  $('go').disabled = false;
  wire();
  setLabel();
  msg('Session attached. Ready.', 'ok');

  $('go').addEventListener('click', () => run(async () => {
    const url = normUrl($('url').value);
    const cs = await customers();
    if (!cs.length){
      pendingUrl = url;
      msg('No customer online yet. ' + ($('auto').checked ? 'Hand-over is armed and will fire the moment one joins.' : 'Press again once they join.'), 'info');
      setLabel();
      if (session.openTab) { try { await session.openTab(url); } catch(e){} }
      return;
    }
    await openAndHandOver(url);
    setLabel();
  }));
})().catch(e => msg(String(e && e.message ? e.message : e)));

function setLabel(){
  $('go').textContent = handedOver ? 'Hand over again'
    : (pendingUrl && $('auto').checked) ? 'Armed — waiting for customer'
    : 'Open and hand over';
}
function wire(){
  const note = (idx) => { if (idx && !joined.includes(idx)) joined.push(idx); };
  session.on('participant_joined', (s, ev) => { note(ev && ev.clientIndex); maybeAutohandover(); setLabel(); });
  session.on('viewer_joined',      (s, ev) => { note(ev && ev.clientIndex); maybeAutohandover(); setLabel(); });
  session.on('participant_left',   (s, ev) => { joined = joined.filter(i => i !== (ev && ev.clientIndex)); });
  session.on('host_changed',       () => { handedOver = false; setLabel(); });
  session.on('session_ended',      () => { $('go').disabled = true; msg('Session ended.', 'info'); });
}
async function maybeAutohandover(){
  if (!$('auto').checked || handedOver || !pendingUrl) return;
  await wait(1200);
  const cs = await customers();
  if (!cs.length) return;
  try { await openAndHandOver(pendingUrl); setLabel(); }
  catch(e){ msg(String(e && e.message ? e.message : e)); }
}
async function run(fn){
  clearMsg();
  try { await fn(); }
  catch(e){
    const m = e && e.message ? e.message : String(e);
    msg(/permission|denied|forbidden|not allowed/i.test(m)
      ? m + ' — the platform only exposes hosting calls to the session-owning context. Allow host switching in Space settings and give the customer host rights.'
      : m);
  }
}
</script>
</body>
</html>

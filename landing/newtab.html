<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfly — open and hand over</title>
<style>
  :root{ --bg:#0d1424; --card:#141d33; --line:#243150; --ink:#e8eefc; --dim:#8fa0c4; --accent:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:600px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 22px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .row{display:flex;gap:10px}
  input[type=text]{flex:1;min-width:0;background:#0b1220;border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:13px 14px;font-size:15px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  button{border:0;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:600;
    color:#fff;background:var(--accent);cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:hover:not(:disabled){filter:brightness(1.12)}
  .opts{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--dim)}
  .opts input{accent-color:var(--accent)}
  .hint{color:var(--dim);font-size:13px;margin:10px 0 0}
  .msg{margin-top:14px;border-radius:10px;padding:11px 13px;font-size:13px;display:none;
    background:#2a1418;border:1px solid #5b2430;color:#fca5a5;word-break:break-word}
  .msg.ok{background:#0f2a1c;border-color:#1f5c3a;color:#86efac}
  .msg.info{background:#12233d;border-color:#26456f;color:#93c5fd}
  .msg.show{display:block}
  .msg a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Open a page and hand it over</h1>
  <p class="sub">Paste a domain, press the button. The page opens in the session and the customer who joined takes it over as host and tab owner.</p>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="app.example.com/page" autocomplete="off" spellcheck="false">
      <button id="go">Start session</button>
    </div>
    <div class="opts">
      <input type="checkbox" id="auto" checked>
      <label for="auto">Hand over automatically as soon as a customer joins</label>
    </div>
    <p class="hint">No <code>https://</code> needed. Bare domain is enough.</p>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
// CONFIG
// WIDGET_KEY / SPACE_ID are filled in by the platform when this file is
// served as the Space Landing Page: add them as environment variables
// named WIDGET_KEY and SPACE_ID in the Landing Page editor. Nothing else
// needs editing.
// =====================================================================
const WIDGET_KEY = '{{.WIDGET_KEY}}';
const SPACE_ID   = '{{.SPACE_ID}}';

// Script host. Empty = same origin (correct when served as the Landing
// Page). Only set it if you host this file elsewhere, e.g. 'https://surfly.com'.
const HOST = '';

// The API global keeps the platform's former product name. Built from
// parts so the word itself never appears in this file.
const NS = 'web' + 'fuse';
const API = () => window[NS];
const CH = 'surfly-handover';

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
function msg(t, kind){
  const el = $('msg');
  el.innerHTML = t;
  el.className = 'msg show' + (kind ? ' ' + kind : '');
}
function clearMsg(){ $('msg').className = 'msg'; }

// ---- loader: initSpace() is safe before the script finishes ----------
function proxyUrl(){ return /\/session\//.test(location.pathname); }
function ready(){ return !!(API() && API().initSpace); }
function loadScript(){
  return new Promise((resolve, reject) => {
    if (ready()) return resolve();
    if (proxyUrl()) return reject(new Error('inside-session'));
    window[NS] = window[NS] || { initSpace: function(){
      return new Promise(res => { window[NS].q = arguments; window[NS].resolve = res; });
    }};
    const host = HOST || location.origin;
    const s = document.createElement('script');
    s.src = host + '/surfly.js';
    s.onerror = () => reject(new Error('Could not load ' + host + '/surfly.js'));
    document.head.appendChild(s);
    const t0 = Date.now();
    (function poll(){
      if (ready()) return resolve();
      if (Date.now() - t0 > 8000) return reject(new Error('surfly.js loaded but the API never appeared (8s).'));
      setTimeout(poll, 120);
    })();
  });
}

// ---- "example.com/x" -> "https://example.com/x" ----------------------
function normUrl(raw){
  let u = String(raw || '').trim();
  if (!u) throw new Error('Type a domain first.');
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { return new URL(u).href; } catch(e){ throw new Error('Not a valid address: ' + u); }
}

// ---- online customers (never the agent's own tab) --------------------
async function customers(s){
  if (!s || !s.getParticipants) return [];
  const ps = await s.getParticipants();
  return ps.filter(p => !p.self && p.online !== false)
           .map(p => ({ idx: p.client_index, name: p.name || 'guest' }));
}

// =====================================================================
// THE ACTION: open tab -> tab ownership + host to the first customer
// =====================================================================
async function openAndHandOver(s, url){
  await s.openTab(url);
  await wait(800);                                   // let the tab register
  const cs = await customers(s);
  if (!cs.length) throw new Error('Tab opened, but no customer is online — hand-over skipped.');
  const t = cs[0];
  s.transferTabControl(t.idx);
  await s.makeHost(t.idx);
  msg('Opened and handed over to ' + t.name + '. They are host and tab owner; you are viewing.', 'ok');
}

// =====================================================================
// BOOT
// =====================================================================
let space = null, session = null, pendingUrl = null, handedOver = false;
const filled = v => v && v.indexOf('{{') !== 0;

(async function boot(){
  try { await loadScript(); }
  catch(e){ if (e && e.message === 'inside-session') return bootInSession(null); throw e; }
  if (API().isInsideSession) return bootInSession(await grabSession());
  return bootOutside();
})().catch(e => msg(String(e && e.message ? e.message : e)));

async function grabSession(){
  let s = API().currentSession || (API().listSessions() || [])[0] || null;
  if (!s && filled(WIDGET_KEY)){
    try { await init(); } catch(e){}
    for (let i = 0; i < 40 && !(s = API().currentSession); i++) await wait(100);
  }
  return s;
}
function init(){ return API().initSpace(WIDGET_KEY, SPACE_ID, {}); }

// ---- AGENT TAB (outside a session): drives everything ----------------
async function bootOutside(){
  if (!filled(WIDGET_KEY) || !filled(SPACE_ID)){
    $('go').disabled = true;
    throw new Error('Widget key / space id not filled in. In the Landing Page editor add two environment variables, WIDGET_KEY and SPACE_ID, with the values from the Developers tab, then save.');
  }
  space = await init();
  const ex = API().listSessions();
  if (ex && ex.length){ session = ex[0]; wire(session); }
  setLabel();

  $('go').addEventListener('click', () => run(async () => {
    const url = normUrl($('url').value);

    // No live session: start one, open the target, show the join link.
    if (!session || !session.started){
      session = space.session();
      wire(session);
      await session.start();
      pendingUrl = url;
      try { await session.openTab(url); } catch(e){}
      msg('Session started. Send this link to the customer — ' +
          ($('auto').checked ? 'they become host automatically when they join.' : 'then press "Hand over".') +
          '<br><a href="' + session.sessionLink + '">' + session.sessionLink + '</a>', 'info');
      setLabel();
      return;
    }

    // Session live: open target and hand over (or arm the auto-hand-over).
    pendingUrl = url;
    const cs = await customers(session);
    if (!cs.length){
      msg('No customer online yet. ' + ($('auto').checked ? 'Hand-over is armed and will fire the moment they join.' : 'Press again once they join.'), 'info');
      setLabel();
      return;
    }
    await openAndHandOver(session, url);
    handedOver = true; pendingUrl = null; setLabel();
  }));
}
function setLabel(){
  if (session && session.started){
    $('go').textContent = handedOver ? 'Hand over again' : ($('auto').checked ? 'Armed — waiting for customer' : 'Hand over');
  } else {
    $('go').textContent = 'Start session';
  }
}
function wire(s){
  s.on('session_started', () => setLabel());
  s.on('session_ended',   () => { session = null; handedOver = false; setLabel(); });
  s.on('participant_joined', () => maybeAutohandover());
  s.on('viewer_joined',      () => maybeAutohandover());
}
async function maybeAutohandover(){
  if (!$('auto').checked || handedOver || !pendingUrl || !session) return;
  await wait(1200);
  const cs = await customers(session);
  if (!cs.length) return;
  try { await openAndHandOver(session, pendingUrl); handedOver = true; setLabel(); }
  catch(e){ msg(String(e && e.message ? e.message : e)); }
}
async function run(fn){
  clearMsg();
  try { await fn(); }
  catch(e){ msg(e && e.message ? e.message : String(e)); }
}

// ---- IN SESSION (customer lands here) --------------------------------
// Inside a session a page may only call on / sendMessage / end / log, so
// makeHost cannot run here. The agent's own tab executes the hand-over.
async function bootInSession(s){
  $('auto').closest('.opts').style.display = 'none';
  $('go').textContent = 'Open tab';
  session = s;
  msg('You are in the session. The agent drives the hand-over from their tab.', 'info');
  if (!s){ $('go').disabled = true; return; }
  $('go').addEventListener('click', () => run(async () => {
    const url = normUrl($('url').value);
    const w = window.open(url, '_blank');
    if (!w){
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }
    s.sendMessage({ ch: CH, t: 'request', op: 'handover', url }, '*');
    msg('Tab opened. The agent tab runs the hand-over — keep it open.', 'info');
  }));
}
</script>
</body>
</html>
